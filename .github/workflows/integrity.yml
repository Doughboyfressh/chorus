name: Evaluation integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Archive tracked source for reproducibility
        run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: integrity-source-${{ github.sha }}
          path: source.tar
          retention-days: 3
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:dev
