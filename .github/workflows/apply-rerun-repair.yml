name: Verify rerun repair
on:
  push:
    branches: [fix/rerun-contract-and-language]
    paths: ['.maintenance/rerun-*.b64', '.github/workflows/apply-rerun-repair.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rerun-contract-and-language
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve staged bytes
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/staged.tar
      - name: Check and apply reviewed patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          text = ''.join(Path(f'.maintenance/rerun-{i}.b64').read_text().strip() for i in range(5))
          assert hashlib.sha256(text.encode()).hexdigest() == '11cfac505ce876c5db187a1a57a85e97767b7735f4fd7bcf245c018560803a72', 'Staged patch bytes changed'
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'eeb1f1e48a52c2cd7e6d70a80dd1944b92e4376de69db5f3586cc91aface53e6'
          Path('/tmp/rerun.patch').write_bytes(patch)
          PY
          git apply --check /tmp/rerun.patch
          git apply /tmp/rerun.patch
          git diff --check
      - name: Locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/install.log
      - name: All core and rerun regressions
        run: node --experimental-strip-types --test src/lib/chorus/*.test.ts 2>&1 | tee evidence/core.log
      - name: Saved experiment SQL and controlled runner
        run: node --experimental-strip-types --test tests/experiments-storage.test.ts 2>&1 | tee evidence/experiments.log
      - name: SQL attempt integrity
        run: npm run test:integrity:db 2>&1 | tee evidence/sql.log
      - name: Executable fixture controls
        run: npm run test:fixtures 2>&1 | tee evidence/fixtures.log
      - name: Application and authentication
        run: node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts 2>&1 | tee evidence/application.log
      - name: Build
        run: npm run build:dev 2>&1 | tee evidence/build.log
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Publish tested source to repair branch only
        run: |
          git config user.name 'Chorus repair automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .maintenance/rerun-*.b64
          git add src tests SECURITY.md .maintenance
          git commit -m 'fix: validate conductor output and repair rerun language handling'
          git push origin HEAD:fix/rerun-contract-and-language
          git rev-parse HEAD > evidence/verified-commit.txt
      - name: Preserve source and logs even on failure
        if: always()
        run: |
          tar -cf evidence/source.tar src tests scripts migrations package.json package-lock.json tsconfig.json vite.config.ts SECURITY.md EXPERIMENTS.md
          git diff --binary > evidence/uncommitted.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerun-repair-${{ github.run_id }}
          path: evidence
          retention-days: 7
