name: Saved experiments browser
on:
  push:
    branches: [feat/saved-experiments]
    paths: [.github/workflows/experiments-browser.yml, tests/experiments-browser.mjs]
  pull_request:
    paths: ['src/components/chorus/experiments.tsx', 'src/lib/chorus/experiments/**', 'tests/experiments-browser.mjs', '.github/workflows/experiments-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mkdir -p evidence && npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare application
        run: npm run build:dev 2>&1 | tee evidence/build.log
      - name: Start isolated local application
        run: |
          npm run dev > evidence/server.log 2>&1 &
          for i in {1..40}; do if curl -sf http://127.0.0.1:8080/experiments >/dev/null; then break; fi; sleep 1; done
          curl -sf http://127.0.0.1:8080/experiments >/dev/null
      - name: Install browser for the locked test dependency
        run: npx playwright install --with-deps chromium
      - name: Test persistence, cross-device recovery and client run controls
        run: |
          node --experimental-strip-types tests/experiments-browser.mjs 2>&1 | tee evidence/browser.log
          test -s evidence/browser-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments-browser-${{ github.run_id }}
          path: evidence
          retention-days: 7
