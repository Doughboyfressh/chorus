name: Verify saved experiments
on:
  push:
    branches: [feat/saved-experiments]
    paths: [.github/workflows/apply-experiments.yml, '.maintenance/experiments*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-saved-experiments
  cancel-in-progress: true
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/saved-experiments
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Preserve staged bytes for verification
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > staged-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: experiments-staged-${{ github.run_id }}
          path: staged-source.tar
          retention-days: 3
      - name: Verify and apply reviewed source
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          chunks = [Path(f'.maintenance/experiments-{i}.b64').read_text().strip() for i in range(7)]
          assert len(chunks[5]) == 6501 and chunks[5][633] == 'O'
          chunks[5] = chunks[5][:633] + chunks[5][634:]
          assert hashlib.sha256(chunks[5].encode()).hexdigest() == '61e4ceec0d3eac836b926a68a53b26265554b6e0ea6a48f77c22506797b9c2f9'
          for i, chunk in enumerate(chunks):
              print(i, len(chunk), hashlib.sha256(chunk.encode()).hexdigest())
          data = base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'd3fee9fdc57e4ed433734bd53c02ec5c4194cff43d132843e39db6c256f61db3', 'Staged bytes differ'
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'c37ad8d762c216650d640c4b2513171233c555e8ec0f5565e2f68dfe2a1f3342'
          Path('/tmp/experiments.patch').write_bytes(patch)
          PY
          git apply --check /tmp/experiments.patch
          git apply /tmp/experiments.patch
          git diff --check
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee evidence/install.log
      - name: Chorus core regressions
        run: node --experimental-strip-types --test src/lib/chorus/*.test.ts 2>&1 | tee evidence/core.log
      - name: Saved experiment SQL and controlled runner tests
        run: node --experimental-strip-types --test tests/experiments-storage.test.ts 2>&1 | tee evidence/experiments.log
      - name: Existing SQL and executable fixture regressions
        run: |
          npm run test:integrity:db 2>&1 | tee evidence/sql.log
          npm run test:fixtures 2>&1 | tee evidence/fixtures.log
      - name: Application and authentication regressions
        run: node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts 2>&1 | tee evidence/application.log
      - name: Build application and generated router types
        run: npm run build:dev 2>&1 | tee evidence/build.log
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Commit verified source only
        run: |
          git config user.name 'Doughboyfressh'
          git config user.email 'Doughboyfressh@users.noreply.github.com'
          rm .maintenance/experiments-*.b64
          git add src tests migrations package.json vite.config.ts EXPERIMENTS.md SECURITY.md .maintenance
          git commit -m 'feat: durable experiments and budgeted Prompt comparison receipts'
          git push origin HEAD:feat/saved-experiments
          git rev-parse HEAD > evidence/verified-commit.txt
      - name: Archive source and verification evidence
        if: always()
        run: |
          git diff > evidence/uncommitted.patch
          git archive --format=tar HEAD > evidence/source.tar
          if [ -f .vercel/output/functions/__server.func/.vc-config.json ]; then cp .vercel/output/functions/__server.func/.vc-config.json evidence/vercel-function.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments-verification-${{ github.run_id }}
          path: evidence
          retention-days: 7
