name: Verify RSI repair
on:
  push:
    branches: [fix/rsi-execution-feedback]
    paths: [.github/workflows/apply-rsi-repair.yml]
permissions:
  contents: write
concurrency:
  group: apply-rsi-execution-feedback
  cancel-in-progress: true
jobs:
  apply-and-verify:
    if: github.repository == 'Doughboyfressh/chorus' && github.ref == 'refs/heads/fix/rsi-execution-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify reviewed patch bytes and apply atomically
        run: |
          mkdir -p evidence
          cat > /tmp/repair.sha256 <<'HASHES'
          496b23491327a8687d558447aa9d50b0665aa59368a1167fa36f2a4d35be1e11  .maintenance/rsi-repair-0.patch
          bb5bb8b05097d691967e4c2e29fe7045e73b549d2f2d5b6f0206f2b2af1f3f15  .maintenance/rsi-repair-1.patch
          bf75a66bb4864b9422e82c62c4718d4529674aacf4ad8173fc665a1a4a5e37e2  .maintenance/rsi-repair-2.patch
          5a1f0f1a0639ca92b5df60a7bfeb685d02e68ea5e2d2a9d9c41f212076c63804  .maintenance/rsi-repair-3.patch
          65ba78057e85c55c0aa29259961925e1035e10997e5ac35836d0ab9c401263b3  .maintenance/rsi-repair-4.patch
          c0ead2824fd6a6fe7607c7a57aaa8357b4e9c7190e8f3f8284a7c5b3c6e5ca94  .maintenance/rsi-repair-5.patch
          HASHES
          sha256sum --check /tmp/repair.sha256 | tee evidence/patch-check.log
          cat .maintenance/rsi-repair-{0,1,2,3,4,5}.patch > evidence/reviewed.patch
          git apply --unidiff-zero --index --check evidence/reviewed.patch
          git apply --unidiff-zero --index evidence/reviewed.patch
          git diff --cached --check
      - name: Install exact dependencies
        run: npm ci --ignore-scripts 2>&1 | tee evidence/install.log
      - name: Chorus regression suite
        run: node --experimental-strip-types --test src/lib/chorus/*.test.ts 2>&1 | tee evidence/core.log
      - name: Production SQL integration suite
        run: npm run test:integrity:db 2>&1 | tee evidence/storage.log
      - name: Application and authentication suite
        run: node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts 2>&1 | tee evidence/application.log
      - name: Build application and generate router types
        run: npm run build:dev 2>&1 | tee evidence/build.log
      - name: Typecheck application
        run: npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Commit tested source to repair branch only
        run: |
          git rm .maintenance/rsi-repair-{0,1,2,3,4,5}.patch .github/workflows/apply-rsi-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve full RSI artifacts and report recoverable evaluation errors'
          git push origin HEAD:refs/heads/fix/rsi-execution-feedback
          git rev-parse HEAD | tee evidence/verified-commit.txt
      - name: Preserve verification evidence
        if: always()
        run: |
          mkdir -p evidence
          git archive --format=tar "$(git write-tree)" > evidence/source.tar
          git diff --cached > evidence/staged.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi-repair-${{ github.run_id }}
          path: evidence/
          retention-days: 7
