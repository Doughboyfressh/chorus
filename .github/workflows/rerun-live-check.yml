name: Rerun repair preview verification
on:
  push:
    branches: [fix/rerun-contract-and-language]
    paths: ['.github/workflows/rerun-live-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      CHORUS_BASE_URL: https://chorus-ohlou2ovu-doughboyfressh.vercel.app
      CHORUS_SMOKE_ALLOW_DISPOSABLE_WRITES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 566c064d8286931d946781ffcbeab5563d16cd07
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Grading and conductor recovery
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          CHORUS_SMOKE_REPORT=evidence/grading.json node tests/grading-live-smoke.mjs 2>&1 | tee evidence/grading.log
      - name: Existing full-swarm and execution integrity
        run: CHORUS_SMOKE_REPORT=evidence/swarm.json node tests/rsi-live-smoke.mjs 2>&1 | tee evidence/swarm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerun-preview-${{ github.run_id }}
          path: evidence
          retention-days: 7
