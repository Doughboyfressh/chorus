name: Saved workspace deployed verification
on:
  push:
    branches: [feat/saved-experiments]
    paths: [.github/workflows/experiments-live.yml, tests/experiments-live-smoke.mjs]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real preview storage and access boundaries
        env:
          CHORUS_BASE_URL: https://chorus-oi9l4w6hd-doughboyfressh.vercel.app
          CHORUS_SMOKE_ALLOW_DISPOSABLE_WRITES: '1'
          CHORUS_SMOKE_REPORT: evidence/preview.json
        run: |
          mkdir -p evidence
          node tests/experiments-live-smoke.mjs 2>&1 | tee evidence/preview.log
          test -s evidence/preview.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments-live-${{ github.run_id }}
          path: evidence
          retention-days: 7
