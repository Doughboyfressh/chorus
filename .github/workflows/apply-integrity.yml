name: Apply reviewed integrity repair
on:
  push:
    branches: [fix/evaluation-integrity]
    paths: [.github/workflows/apply-integrity.yml, '.maintenance/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-reviewed-integrity
  cancel-in-progress: true
jobs:
  apply-and-verify:
    if: github.repository == 'Doughboyfressh/chorus' && github.ref == 'refs/heads/fix/evaluation-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply the reviewed patch
        run: |
          set -euo pipefail
          sed -i "s/process-local PGlite cannot/process-local PGLite cannot/" .maintenance/integrity-1.patch
          cat .maintenance/integrity-{1,2,3,4,5,6}.patch > /tmp/integrity.patch
          echo 'a508b7127d68f7a79f06e10a5f91495774e58bdce9db962bf6bcb7133ddfb611  /tmp/integrity.patch' | sha256sum -c -
          git restore .maintenance/integrity-1.patch
          git apply --unidiff-zero --index --check /tmp/integrity.patch
          git apply --unidiff-zero --index /tmp/integrity.patch
          git rm .maintenance/integrity-{1,2,3,4,5,6}.patch
      - name: Repair existing inconsistent dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit applied code to repair branch only
        run: |
          git add package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce evaluation integrity and quarantine unverified training data'
          git push origin HEAD:refs/heads/fix/evaluation-integrity
      - name: Install locked dependencies
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Core regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p verification
          node --experimental-strip-types --test src/lib/chorus/*.test.ts 2>&1 | tee verification/core.log
      - name: Production SQL integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:integrity:db 2>&1 | tee verification/database.log
      - name: Application typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee verification/typecheck.log
      - name: Application build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee verification/build.log
      - name: Record full suite without hiding existing failures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/full-suite.log
      - name: Archive applied source and evidence
        if: always()
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git status --short > verification/worktree.txt
          git archive --format=tar HEAD > verification/source.tar
          cp package-lock.json verification/package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-integrity-${{ github.run_id }}
          path: verification
          retention-days: 7
