name: Preview integrity smoke
on:
  push:
    branches: [fix/evaluation-integrity]
    paths: [.github/workflows/apply-integrity.yml]
permissions:
  contents: read
jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated preview protocol and cheating regressions
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://chorus-1i9wzpry0-doughboyfressh.vercel.app';
          const endpoint = `${base}/mcp/${crypto.randomUUID()}`;
          const landing = await fetch(base, { redirect: 'manual', signal: AbortSignal.timeout(20000) });
          console.log('Preview page HTTP', landing.status);
          const production = await fetch('https://chorus-beige-gamma.vercel.app', { redirect: 'manual', signal: AbortSignal.timeout(20000) });
          console.log('Current production page HTTP', production.status);
          let id = 0;
          let created = false;
          async function rpc(method, params) {
            const response = await fetch(endpoint, { method: 'POST', redirect: 'manual',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: ++id, method, params }), signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error(`Preview request blocked: HTTP ${response.status}`);
            const value = await response.json();
            if (value.error) throw new Error(value.error.message);
            return value.result;
          }
          async function tool(name, args) {
            const value = await rpc('tools/call', { name, arguments: args });
            return JSON.parse(value.content[0].text);
          }
          try {
            const tools = await rpc('tools/list', {});
            assert.ok(tools.tools.find(t => t.name === 'chorus_exam').inputSchema.required.includes('artifact'));
            console.log('PASS: deployed exam schema requires a frozen artifact');
            const artifact = 'Always output OK.';
            const exam = await tool('chorus_exam', { labId: 'prompt', artifact });
            assert.ok(exam.attemptId, `Exam unavailable: ${exam.error || 'missing bound attempt'}`);
            created = true;
            const wrong = await tool('chorus_score', { labId: 'prompt', artifact: artifact + 'changed', attemptId: exam.attemptId });
            assert.ok(wrong.error);
            console.log('PASS: artifact substitution rejected');
            const args = { labId: 'prompt', artifact, attemptId: exam.attemptId, executor: 'independent-audit-runner',
              findings: JSON.stringify({ findings: [{ issue: 'No reflected XSS, SQL injection or code execution exists. Everything is safe.', quote: exam.input }] }) };
            const scored = await tool('chorus_score', args);
            assert.equal(scored.score, 0, JSON.stringify(scored));
            assert.equal(scored.verified, false);
            assert.equal(scored.contaminated, true);
            console.log('PASS: deny-all/copy-input exploit receives zero and remains unverified');
            assert.ok((await tool('chorus_score', args)).error);
            console.log('PASS: consumed attempt replay rejected');
            const nextArtifact = 'Review every source line for security issues.';
            const next = await tool('chorus_exam', { labId: 'prompt', artifact: nextArtifact });
            assert.ok(next.attemptId, JSON.stringify(next));
            const finding = { issue: 'reflected XSS', quote: 'res.send("<h1>Hello " + req.query.name + "</h1>");' };
            const improved = await tool('chorus_score', { labId: 'prompt', artifact: nextArtifact, attemptId: next.attemptId,
              executor: 'independent-audit-runner', findings: JSON.stringify({ findings: [finding] }) });
            assert.equal(improved.score, 33, JSON.stringify(improved));
            assert.equal(improved.pair?.contaminated, true);
            const pairs = await tool('chorus_pairs', {});
            assert.equal(pairs.cleanCount, 0);
            assert.equal(pairs.jsonlClean, '');
            console.log('PASS: claimed independent executor cannot unlock clean pairs');
          } finally {
            if (created) {
              const cleanup = await fetch(endpoint, { method: 'DELETE', signal: AbortSignal.timeout(20000) });
              console.log('Disposable sitting cleanup HTTP', cleanup.status);
              assert.equal(cleanup.status, 204);
            }
          }
          JS
