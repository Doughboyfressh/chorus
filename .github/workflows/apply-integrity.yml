name: Finalize integrity verification
on:
  push:
    branches: [fix/evaluation-integrity]
    paths: [.github/workflows/apply-integrity.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'Doughboyfressh/chorus' && github.ref == 'refs/heads/fix/evaluation-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Correct strict optional-result narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/chorus/integrity.test.ts')
          s = p.read_text()
          old = '"graded" in filled && filled.graded.verified === false'
          new = '"graded" in filled && filled.graded?.verified === false'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          git add src/lib/chorus/integrity.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: narrow optional orchestra grade before asserting verification status'
          git push origin HEAD:refs/heads/fix/evaluation-integrity
      - run: npm ci --ignore-scripts --no-audit --no-fund
        id: install
      - name: Core and production SQL regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p verification
          node --experimental-strip-types --test src/lib/chorus/*.test.ts 2>&1 | tee verification/core.log
          npm run test:integrity:db 2>&1 | tee verification/database.log
      - name: Build and typecheck generated routes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build:dev 2>&1 | tee verification/build.log
          npm run typecheck 2>&1 | tee verification/typecheck.log
      - name: Other application tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          node --experimental-strip-types --test src/lib/app-data/app-data.test.ts src/lib/app-data/readiness-schedule.test.ts src/lib/auth/gate-identity.test.ts src/lib/auth/sign-in-gate.test.ts 2>&1 | tee verification/application.log
      - name: Archive evidence
        if: always()
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=tar HEAD > verification/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-integrity-${{ github.run_id }}
          path: verification
          retention-days: 7
