name: RSI browser and state verification
on:
  push:
    branches: [fix/rsi-execution-feedback]
    paths: [.github/workflows/rsi-browser-verification.yml]
permissions:
  contents: write
concurrency:
  group: rsi-browser-repair
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Doughboyfressh/chorus' && github.ref == 'refs/heads/fix/rsi-execution-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed stale-state correction
        run: |
          mkdir -p evidence
          echo '797fbff36dd8618a7f904afd306ad225ae5968a25863f8a7bc703009f991724d  .maintenance/rsi-state.patch' | sha256sum --check
          git apply --unidiff-zero --index --check .maintenance/rsi-state.patch
          git apply --unidiff-zero --index .maintenance/rsi-state.patch
          git diff --cached --check
      - run: npm ci --ignore-scripts 2>&1 | tee evidence/install.log
      - name: Core and storage regressions
        run: |
          node --experimental-strip-types --test src/lib/chorus/*.test.ts 2>&1 | tee evidence/core.log
          npm run test:integrity:db 2>&1 | tee evidence/storage.log
      - name: Build and typecheck
        run: |
          npm run build:dev 2>&1 | tee evidence/build.log
          npm run typecheck 2>&1 | tee evidence/typecheck.log
      - name: Start isolated development app
        run: |
          npm run dev > evidence/dev.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/lab > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/lab > /dev/null
      - name: Install browser verification tool
        run: |
          npm install -g agent-browser
          agent-browser install --with-deps
          agent-browser --version | tee evidence/browser-version.txt
      - name: Check browser interactions with synthetic data and mocked model transport
        run: |
          agent-browser open http://127.0.0.1:8080/lab
          agent-browser wait --load networkidle
          agent-browser snapshot -i > evidence/before-snapshot.txt
          agent-browser eval --stdin <<'JS' | tee evidence/browser-check.log
          (async () => {
            const assert = (value, message) => { if (!value) throw new Error(message); };
            const until = async (condition) => {
              const end = Date.now() + 10000;
              while (!condition()) { if (Date.now() > end) throw new Error('Timed out waiting for browser state'); await new Promise(r => setTimeout(r, 50)); }
            };
            const { useChorus } = await import('/src/lib/chorus/store.ts');
            const { gradeArtifact } = await import('/src/lib/chorus/grade.ts');
            const tail = 'END-CONTRACT: preserve the final failing-test condition.';
            const artifact = 'Retain this contract rule.\n'.repeat(400) + tail;
            const synthesis = { title: 'Preserved full artifact', deliverable: artifact, steps: [], watchouts: [], pattern: { contract: '', fanout: '', critique: '', merge: '' } };
            const oldSynthesis = { ...synthesis, title: 'Previous artifact', deliverable: 'Previous distinct artifact for comparison.' };
            const oldEval = gradeArtifact({ labId: 'rsi', deliverable: oldSynthesis.deliverable, findings: '{"findings":[]}' });
            const run = { id: crypto.randomUUID(), goal: 'Review the agent without score fabrication', labId: 'rsi', startedAt: Date.now(), phase: 'merge', generation: 2,
              agents: [], synthesis: oldSynthesis, evaluation: oldEval, generations: [{ n: 1, contract: '', whyThisSplit: '', specialists: [], synthesis: oldSynthesis, evaluation: oldEval }] };
            useChorus.setState({ run, history: [], lane: 'api', viewingN: 2, executor: null, slot: { mode: 'custom', kind: 'openai', baseUrl: '', model: '', apiKey: '' } });
            useChorus.getState().applySynthesis(synthesis);
            assert(useChorus.getState().run.evaluation === undefined, 'New artifact inherited old score');
            assert(useChorus.getState().run.generations[0].evaluation.score === 0, 'Previous history changed');
            assert(useChorus.getState().run.generations[1].evaluation === undefined, 'New generation inherited old score');
            useChorus.getState().evaluationFailed('Synthetic provider failure; no score recorded.', 0);
            useChorus.getState().sealGeneration();
            const button = () => [...document.querySelectorAll('button')].find(b => b.textContent.includes('Retry evaluation only'));
            await until(() => Boolean(button()));
            assert(document.body.textContent.includes('Evaluation not scored.'), 'Missing unscored error');
            assert(document.body.textContent.includes(tail), 'Artifact tail missing from display');
            assert(!button().disabled, 'Retry should be available');
            button().click();
            await until(() => useChorus.getState().run.phase === 'done' && useChorus.getState().run.evaluationError?.includes('Set a model'));
            assert(useChorus.getState().run.evaluation === undefined, 'Failed retry manufactured a score');
            assert(useChorus.getState().run.generations.length === 2, 'Retry changed generation count');
            const originalFetch = window.fetch.bind(window);
            let release, calls = 0;
            window.fetch = async (url, options) => {
              if (String(url) === 'http://127.0.0.1:9/v1/chat/completions') {
                calls++;
                const body = JSON.parse(options.body);
                assert(body.messages[0].content.includes(artifact), 'Browser execution shortened artifact');
                await new Promise(resolve => { release = resolve; });
                return new Response(JSON.stringify({ choices: [{ message: { content: '{"findings":[]}' } }] }), { status: 200, headers: { 'content-type': 'application/json' } });
              }
              return originalFetch(url, options);
            };
            useChorus.setState({ executor: null, slot: { mode: 'custom', kind: 'openai', baseUrl: 'http://127.0.0.1:9', model: 'synthetic-browser-test', apiKey: '' } });
            button().click();
            await until(() => calls === 1 && button()?.disabled);
            button().click();
            assert(calls === 1, 'Busy retry allowed duplicate model calls');
            release();
            await until(() => useChorus.getState().run.phase === 'done' && useChorus.getState().run.evaluation?.score === 0);
            assert(useChorus.getState().run.evaluationError === undefined, 'Successful retry retained error');
            assert(useChorus.getState().run.evaluation.verified === false, 'Mocked output became verified');
            assert(useChorus.getState().run.synthesis.deliverable === artifact, 'Retry changed the artifact');
            assert(useChorus.getState().run.generations.length === 2, 'Successful retry reran swarm');
            window.fetch = originalFetch;
            useChorus.getState().evaluationFailed('Example: invalid findings format. Artifact retained; retry with actual output.', 0);
            useChorus.getState().sealGeneration();
            await until(() => Boolean(button()));
            document.querySelector('[role="alert"]')?.scrollIntoView({ block: 'center' });
            return { status: 'PASS', assertions: ['no stale score', 'history retained', 'error not zero', 'full artifact displayed', 'retry-only control', 'no duplicate retry', 'complete model input', 'valid zero retained', 'no new generation', 'unverified remains unverified'], modelCalls: 0, mockedTransportCalls: calls };
          })()
          JS
          agent-browser snapshot -i > evidence/after-snapshot.txt
          agent-browser screenshot evidence/browser-desktop.png
          agent-browser set viewport 390 844
          agent-browser eval 'document.querySelector("[role=alert]")?.scrollIntoView({block:"center"})'
          agent-browser screenshot evidence/browser-mobile.png
          agent-browser errors > evidence/browser-errors.txt
          agent-browser close
      - name: Commit verified correction to repair branch
        run: |
          git rm .maintenance/rsi-state.patch .github/workflows/rsi-browser-verification.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: isolate new artifact assessments and verify browser recovery controls'
          git push origin HEAD:refs/heads/fix/rsi-execution-feedback
          git rev-parse HEAD > evidence/verified-commit.txt
      - name: Archive evidence
        if: always()
        run: |
          mkdir -p evidence
          git archive --format=tar "$(git write-tree)" > evidence/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi-browser-${{ github.run_id }}
          path: evidence/
          retention-days: 7
