name: Deployed RSI verification
on:
  push:
    branches: [fix/rsi-execution-feedback]
    paths: [.github/workflows/rsi-live-verification.yml]
permissions:
  contents: read
jobs:
  deployed-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bound exams, format retries, full swarm, progression and quarantine
        env:
          CHORUS_BASE_URL: https://chorus-b8dj7zeqd-doughboyfressh.vercel.app
          CHORUS_SMOKE_ALLOW_DISPOSABLE_WRITES: '1'
          CHORUS_SMOKE_REPORT: evidence/live-result.json
        run: |
          mkdir -p evidence
          node tests/rsi-live-smoke.mjs 2>&1 | tee evidence/live.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi-deployed-${{ github.run_id }}
          path: evidence/
          retention-days: 7
