name: Production grading verification
on:
  push:
    branches: [fix/task-aware-grading]
    paths: [.github/workflows/grader-production-verification.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHORUS_BASE_URL: https://chorus-beige-gamma.vercel.app
      CHORUS_SMOKE_ALLOW_DISPOSABLE_WRITES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b759e5eeff5aee3dbe67cfd554e5c4b5ad42c61
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Released grading fixes and incorrect counterexamples
        env:
          CHORUS_SMOKE_REPORT: evidence/grading.json
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          node tests/grading-live-smoke.mjs 2>&1 | tee evidence/grading.log
      - name: Full swarm, artifact retention, recovery and replay checks
        env:
          CHORUS_SMOKE_REPORT: evidence/rsi.json
        run: node tests/rsi-live-smoke.mjs 2>&1 | tee evidence/rsi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grading-production-${{ github.run_id }}
          path: evidence
          retention-days: 7
