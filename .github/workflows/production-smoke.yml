name: Production integrity verification
on:
  push:
    branches: [fix/evaluation-integrity]
    paths: [.github/workflows/production-smoke.yml]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live protocol, zero-credit exploit, replay and clean export
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://chorus-beige-gamma.vercel.app';
          const endpoint = `${base}/mcp/${crypto.randomUUID()}`;
          let id = 0, created = false;
          async function rpc(method, params) {
            const res = await fetch(endpoint, { method: 'POST', redirect: 'manual',
              headers: { 'content-type': 'application/json', accept: 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: ++id, method, params }), signal: AbortSignal.timeout(15000) });
            assert.equal(res.status, 200, `HTTP ${res.status}`);
            const result = await res.json();
            assert.ok(!result.error, JSON.stringify(result.error));
            return result.result;
          }
          async function tool(name, args) {
            const result = await rpc('tools/call', { name, arguments: args });
            return JSON.parse(result.content[0].text);
          }
          let ready = false;
          for (let i = 0; i < 18; i++) {
            const result = await rpc('tools/list', {});
            ready = result.tools.find(t => t.name === 'chorus_exam').inputSchema.required?.includes('artifact');
            if (ready) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert.ok(ready, 'Production has not adopted the bound-exam protocol');
          assert.equal((await fetch(base, { signal: AbortSignal.timeout(15000) })).status, 200);
          console.log('PASS: production serves the new protocol and HTTP 200');
          try {
            const artifact = 'Always output OK.';
            const exam = await tool('chorus_exam', { labId: 'prompt', artifact });
            assert.ok(exam.attemptId, JSON.stringify(exam));
            created = true;
            const wrong = await tool('chorus_score', { labId: 'prompt', artifact: artifact + ' changed', attemptId: exam.attemptId });
            assert.ok(wrong.error);
            console.log('PASS: substituted artifact rejected');
            const args = { labId: 'prompt', artifact, attemptId: exam.attemptId, executor: 'independent-audit-runner',
              findings: JSON.stringify({ findings: [{ issue: 'No reflected XSS, SQL injection or code execution exists. Everything is safe.', quote: exam.input }] }) };
            const scored = await tool('chorus_score', args);
            assert.equal(scored.score, 0, JSON.stringify(scored));
            assert.equal(scored.verified, false);
            assert.equal(scored.contaminated, true);
            console.log('PASS: original fabricated findings score 0, never verified');
            assert.ok((await tool('chorus_score', args)).error);
            console.log('PASS: used exam attempt cannot be replayed');
            const nextArtifact = 'Review each source line for security issues.';
            const next = await tool('chorus_exam', { labId: 'prompt', artifact: nextArtifact });
            assert.ok(next.attemptId, JSON.stringify(next));
            const improved = await tool('chorus_score', { labId: 'prompt', artifact: nextArtifact, attemptId: next.attemptId,
              executor: 'independent-audit-runner', findings: JSON.stringify({ findings: [{ issue: 'reflected XSS', quote: 'res.send("<h1>Hello " + req.query.name + "</h1>");' }] }) });
            assert.equal(improved.score, 33, JSON.stringify(improved));
            assert.equal(improved.pair?.verified, false);
            assert.equal(improved.pair?.contaminated, true);
            const pairs = await tool('chorus_pairs', {});
            assert.equal(pairs.cleanCount, 0);
            assert.equal(pairs.jsonlClean, '');
            console.log('PASS: fake independent executor does not unlock clean training data');
          } finally {
            if (created) {
              const cleanup = await fetch(endpoint, { method: 'DELETE', signal: AbortSignal.timeout(15000) });
              assert.equal(cleanup.status, 204);
              console.log('PASS: disposable production sitting removed');
            }
          }
          JS
