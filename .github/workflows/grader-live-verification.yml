name: Deployed grading verification
on:
  push:
    branches: [fix/task-aware-grading]
    paths: [.github/workflows/grader-live-verification.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHORUS_BASE_URL: https://chorus-5xkuok294-doughboyfressh.vercel.app
      CHORUS_SMOKE_ALLOW_DISPOSABLE_WRITES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Grading repair and counterexample checks
        env:
          CHORUS_SMOKE_REPORT: evidence/grading.json
        run: |
          mkdir -p evidence
          node tests/grading-live-smoke.mjs 2>&1 | tee evidence/grading.log
      - name: Existing full-swarm, recovery and replay checks
        env:
          CHORUS_SMOKE_REPORT: evidence/rsi.json
        run: node tests/rsi-live-smoke.mjs 2>&1 | tee evidence/rsi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grading-live-${{ github.run_id }}
          path: evidence
          retention-days: 7
